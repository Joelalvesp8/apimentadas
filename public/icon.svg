<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo branco com borda arredondada -->
  <rect width="512" height="512" rx="128" fill="white"/>

  <!-- Círculo de fundo (halo sutil) -->
  <circle cx="256" cy="280" r="160" fill="#ffe5e5" opacity="0.3"/>

  <!-- Corpo principal da pimenta -->
  <path d="M 256 120
           C 280 120 295 130 305 150
           C 315 170 318 195 315 225
           C 312 255 305 285 298 315
           C 291 345 283 375 278 400
           C 275 415 273 425 256 435
           C 239 425 237 415 234 400
           C 229 375 221 345 214 315
           C 207 285 200 255 197 225
           C 194 195 197 170 207 150
           C 217 130 232 120 256 120 Z"
        fill="url(#pepperGradient)"
        filter="url(#shadow)"/>

  <!-- Brilho principal -->
  <ellipse cx="235" cy="200" rx="25" ry="50" fill="url(#shineGradient)" opacity="0.6"/>

  <!-- Brilhos secundários -->
  <ellipse cx="245" cy="280" rx="15" ry="25" fill="#ff6b6b" opacity="0.4"/>
  <ellipse cx="265" cy="250" rx="10" ry="20" fill="#ff8787" opacity="0.3"/>

  <!-- Caule/talo -->
  <path d="M 256 120
           C 250 110 248 100 250 90
           C 252 80 256 75 260 72
           L 265 68
           C 268 66 272 66 275 68
           L 280 72
           C 284 75 288 80 290 90
           C 292 100 290 110 284 120"
        fill="url(#stemGradient)"
        stroke="#0d5c2f"
        stroke-width="2"/>

  <!-- Folha 1 -->
  <path d="M 255 95
           Q 240 92 233 100
           Q 230 106 236 112
           Q 242 116 250 114
           L 255 95 Z"
        fill="url(#leafGradient)"
        stroke="#0d5c2f"
        stroke-width="1.5"/>

  <!-- Folha 2 -->
  <path d="M 270 100
           Q 280 98 285 105
           Q 288 110 283 115
           Q 277 118 270 116
           L 270 100 Z"
        fill="url(#leafGradient)"
        stroke="#0d5c2f"
        stroke-width="1.5"/>

  <!-- Gotículas de calor/suor -->
  <ellipse cx="290" cy="180" rx="8" ry="14" fill="url(#dropGradient)" opacity="0.85"/>
  <ellipse cx="295" cy="240" rx="6" ry="11" fill="url(#dropGradient)" opacity="0.8"/>
  <ellipse cx="220" cy="220" rx="7" ry="12" fill="url(#dropGradient)" opacity="0.8"/>
  <ellipse cx="215" cy="280" rx="5" ry="10" fill="url(#dropGradient)" opacity="0.75"/>

  <!-- Brilhos nas gotículas -->
  <ellipse cx="288" cy="177" rx="3" ry="6" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="218" cy="218" rx="2.5" ry="5" fill="#ffffff" opacity="0.6"/>

  <!-- Sombra suave embaixo -->
  <ellipse cx="256" cy="445" rx="110" ry="15" fill="#e0e0e0" opacity="0.4"/>

  <!-- Gradientes e filtros -->
  <defs>
    <!-- Gradiente da pimenta (vermelho intenso com volume) -->
    <linearGradient id="pepperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#e62020;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cc1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b31515;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente do brilho -->
    <radialGradient id="shineGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ff6666;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff4444;stop-opacity:0" />
    </radialGradient>

    <!-- Gradiente do caule -->
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d8659;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e6b42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#155c36;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente da folha -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb878;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d9960;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228850;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente das gotículas (dourado/amarelo brilhante) -->
    <radialGradient id="dropGradient" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#fffbcc;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffd966;stop-opacity:0.95" />
      <stop offset="80%" style="stop-color:#f4c430;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0.85" />
    </radialGradient>

    <!-- Sombra suave -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
